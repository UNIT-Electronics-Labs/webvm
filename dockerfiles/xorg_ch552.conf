Section "Device"
    Identifier "CheerpX Display"
    Driver "modesetting"
    Option "AccelMethod" "none"
    Option "DRI" "0"
    Option "SWcursor" "true"
EndSection

# CheerpX does not expose a real udev-managed input device tree.  Avoid
# waiting for or probing that unavailable monitor; keyboard and pointer input
# are delivered through the WebVM display canvas instead.
Section "ServerFlags"
    Option "AutoAddDevices" "off"
    Option "AutoEnableDevices" "off"
EndSection
